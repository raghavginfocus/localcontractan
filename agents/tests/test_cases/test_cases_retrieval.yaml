  # SIMPLE FACTUAL QUERIES
  # ===========================================
  
  - id: "contract_count"
    name: "Contract Count Query"
    question: "How many contracts do we have in our system?"
    description: "Tests basic contract counting functionality"
    category: "factual"
    level: "simple"
    expected_keywords:
      - "contract"
      - "contracts"
    expected_keywords_any:
      - "22"
      - "twenty"
      - "document"
    min_confidence: 0.3
    min_kg_facts: 1
    tags:
      - "basic"
      - "count"

  - id: "clause_types_list"
    name: "List All Clause Types"
    question: "What types of clauses are present in our contracts?"
    description: "Tests ontology-based clause type discovery"
    category: "factual"
    level: "simple"
    expected_keywords:
      - "clause"
      - "type"
    expected_keywords_any:
      - "Termination"
      - "Confidentiality"
      - "Liability"
      - "GoverningLaw"
      - "IntellectualProperty"
    min_confidence: 0.3
    min_kg_facts: 1
    tags:
      - "basic"
      - "ontology"

  - id: "confidentiality_clauses_count"
    name: "Count Confidentiality Clauses"
