apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: etcd
  namespace: contract-kg-demo
spec:
  serviceName: etcd
  replicas: 1
  selector:
    matchLabels:
      app: etcd
  template:
    metadata:
      labels:
        app: etcd
    spec:
      containers:
        - name: etcd
          image: quay.io/coreos/etcd:v3.5.5
          # command:
          #   - etcd
          #   - --data-dir=/etcd
          #   - --listen-client-urls=http://0.0.0.0:2379
          #   - --advertise-client-urls=http://etcd.contract-kg-demo.svc.cluster.local:2379
          command:
            - etcd
            - --name=etcd-0
            - --data-dir=/etcd
            - --listen-client-urls=http://0.0.0.0:2379
            - --advertise-client-urls=http://etcd:2379
            - --listen-peer-urls=http://0.0.0.0:2380
            - --initial-advertise-peer-urls=http://etcd:2380
            - --initial-cluster=etcd-0=http://etcd:2380
            - --initial-cluster-state=new
            - --auto-compaction-mode=revision
            - --auto-compaction-retention=1000
            - --snapshot-count=10000
          ports:
            - containerPort: 2379
          volumeMounts:
            - name: etcd-data
              mountPath: /etcd
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
  volumeClaimTemplates:
    - metadata:
        name: etcd-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 20Gi
