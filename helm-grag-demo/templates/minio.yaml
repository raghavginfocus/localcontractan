apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: contract-kg-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
        - name: minio
          image: minio/minio:RELEASE.2023-03-20T20-16-18Z
          args: ["server", "/data", "--console-address=:9001"]
          env:
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: contract-kg-demo-secrets
                  key: MINIO_ACCESS_KEY

            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: contract-kg-demo-secrets
                  key: MINIO_SECRET_KEY
          ports:
            - containerPort: 9000
            - containerPort: 9001

          volumeMounts:
            - name: minio-data
              mountPath: /data  
              
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
      - name: minio-data
        persistentVolumeClaim:
          claimName: minio-pvc          
