apiVersion: apps/v1
kind: Deployment
metadata:
  name: attu
  namespace: contract-kg-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: attu
  template:
    metadata:
      labels:
        app: attu
    spec:
      containers:
        - name: attu
          image: zilliz/attu:v2.3.5
          ports:
            - containerPort: 3000
          env:
            - name: MILVUS_URL
              value: milvus:19530
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
