apiVersion: apps/v1
kind: Deployment
metadata:
  name: retrieval-api
  namespace: contract-kg-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: retrieval-api
  template:
    metadata:
      labels:
        app: retrieval-api
    spec:
      imagePullSecrets:
        - name: ibm-registry-secret

      containers:
        - name: retrieval-api
          image: us.icr.io/projects-common-registry-ns/grag-contract-analysis-docling:v14
          command: ["python","-m","uvicorn","api.retrieval_service:app","--host","0.0.0.0","--port","8002"]

          ports:
            - containerPort: 8002

          resources:
            requests:
              cpu: "2"
              memory: "5Gi"
            limits:
              cpu: "3"
              memory: "6Gi"

          securityContext:
            
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
          env:
            # - name: FUSEKI_URL
            #   value: http://fuseki:3030
            - name: MILVUS_HOST
              value: milvus
            - name: MILVUS_PORT
              value: "19530"
            - name: PHOENIX_COLLECTOR_ENDPOINT
              value: http://phoenix:4317
            - name: PHOENIX_ENABLED
              value: "true"
            - name: PYTHONUNBUFFERED
              value: "1"
            # 👇 ADD THIS (CRITICAL FIX)
            - name: PHOENIX_WORKING_DIR
              value: /app/data/.phoenix  
            - name: PHOENIX_PORT
              value: "4317"  
              
            - name: FUSEKI_URL
              value: http://fuseki:3030
            
            # UNCOMMENT AND FIX THESE (lines 43-48)
            - name: FUSEKI_DATASET
              value: contracts  # NOT "fuseki:3030" - just "contracts"
            
            # - name: FUSEKI_USERNAME
            #   value: "admin"
            
            # - name: FUSEKI_PASSWORD
            #   value: "admin123"  

            - name: HF_HOME
              value: /app/cache
            - name: TRANSFORMERS_CACHE
              value: /app/cache
            - name: SENTENCE_TRANSFORMERS_HOME
              value: /app/cache  
             

          volumeMounts:
            - name: env-file
              mountPath: /app/.env
              subPath: .env
            - name: logs
              mountPath: /app/logs
            - name: checkpoints
              mountPath: /app/checkpoints
            - name: data
              mountPath: /app/data
            - name: hf-cache
              mountPath: /app/cache
            - name: ontology-files
              mountPath: /app/ontology
              readOnly: true  
            

          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 30
            periodSeconds: 10

      volumes:
        - name: env-file
          configMap:
            name: agents-env-config
        - name: logs
          emptyDir: {}
        - name: checkpoints
          emptyDir: {}
        - name: data
          emptyDir: {}
        - name: hf-cache
          emptyDir: {}
        - name: ontology-files
          configMap:
            name: ontology-files  
          